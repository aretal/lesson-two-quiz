<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICT Grade 6 Quiz - Week 2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f4f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .quiz-card { background: #fff; width: 100%; max-width: 650px; border-radius: 16px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #edf2f7; padding-bottom: 15px; }
    .header h1 { font-size: 1.4rem; color: #1a365d; margin-bottom: 5px; }
    .header p { font-size: 0.9rem; color: #4a5568; }
    .designer-credit { font-size: 0.82rem; color: #3182ce; font-weight: 600; margin-top: 6px; }
    .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #3182ce; transition: width 0.3s ease; }
    .question-title { font-size: 1.1rem; font-weight: 600; color: #2d3748; margin-bottom: 15px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { width: 100%; text-align: left; padding: 12px 16px; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; font-weight: 500; color: #2d3748; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { background: #ebf8ff; border-color: #3182ce; }
    .option-btn.correct { background: #c6f6d5; border-color: #38a169; color: #22543d; }
    .option-btn.wrong { background: #fed7d7; border-color: #e53e3e; color: #742a2a; }
    textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; resize: vertical; min-height: 90px; margin-bottom: 12px; outline: none; }
    textarea:focus { border-color: #3182ce; }
    .btn-submit { background: #3182ce; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-submit:hover { background: #2b6cb0; }
    .model-answer { background: #f0fff4; border: 1px solid #9ae6b4; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 0.9rem; color: #22543d; display: none; }
    .feedback { font-weight: 600; margin-top: 15px; min-height: 24px; text-align: center; font-size: 0.95rem; }
    .feedback.correct { color: #38a169; }
    .feedback.wrong { color: #e53e3e; }
    .btn-next { background: #2b6cb0; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; margin-top: 15px; float: right; display: none; }
    .results { text-align: center; }
    .results h2 { font-size: 1.6rem; color: #2b6cb0; margin-bottom: 10px; }
    .score-circle { width: 100px; height: 100px; border-radius: 50%; background: #ebf8ff; border: 4px solid #3182ce; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; color: #2b6cb0; margin: 20px auto; }
    .restart-btn { background: #38a169; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 15px; }
    .clear { clear: both; }
  </style>
</head>
<body>

<div class="quiz-card" id="quizCard">
  <div class="header">
    <h1>ICT Grade 6 - Assessment (Week 2)</h1>
    <p>Unit 1: Lesson 2 - Future Technology</p>
    <div class="designer-credit">Prepared by Web Designer: Asmaa Kamar Mohamed</div>
  </div>
  
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div id="quizContent">
    <div class="question-title" id="questionText">Loading...</div>
    <div id="answerArea"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next Question ➔</button>
    <div class="clear"></div>
  </div>

  <div id="resultContent" class="results" style="display: none;">
    <h2>Great Job! 🎉</h2>
    <p>You have completed the ICT Week 2 Quiz.</p>
    <div class="score-circle" id="scoreDisplay">0%</div>
    <p id="scoreText"></p>
    <button class="restart-btn" onclick="restartQuiz()">Try Again 🔄</button>
  </div>
</div>

<script>
const questions = [
  { q: "1. It uses a three-dimensional environment that allows you to treat what you see and hear as if it were real.", options: ["Virtual reality", "Switches", "Digital footprint", "Assistive technology"], answer: 0 },
  { q: "2. Which technology is used to unlock the phone using the facial recognition system?", options: ["Assistive technology", "Artificial intelligence", "Virtual reality", "Switches"], answer: 1 },
  { q: "3. You can go to an ancient archaeological site and go back thousands of years using ......... technology.", options: ["Modem", "Virtual reality", "Bluetooth", "Router"], answer: 1 },
  { q: "4. Which technology combines the real world and virtual reality?", options: ["augmented reality", "Modem", "Bluetooth", "Router"], answer: 0 },
  { q: "5. Which technology helps in teaching in an interactive way and consolidating information?", options: ["Digital footprint", "Switches", "Modem", "augmented reality"], answer: 3 },
  { q: "6. Headphones are worn to handle the technology of .........", options: ["Virtual reality", "Digital footprint", "the pirate", "Scanner"], answer: 0 },
  { q: "7. You can see atoms and insects larger than you using ......... technology.", options: ["Virtual reality", "Switches", "Modem", "router"], answer: 0 },
  { q: "8. ......... technology improves the lives of people with disabilities.", options: ["Assistive technology", "Old technology", "Traditional technology", "Complex technology"], answer: 0 }
];

let currentIndex = 0;
let score = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'correct') {
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } else {
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }
  } catch(e){}
}

function loadQuestion() {
  const current = questions[currentIndex];
  document.getElementById("progress").style.width = `${(currentIndex / questions.length) * 100}%`;
  document.getElementById("questionText").textContent = current.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("nextBtn").style.display = "none";

  const container = document.getElementById("answerArea");
  container.innerHTML = "";

  const optionsDiv = document.createElement("div");
  optionsDiv.className = "options";
  current.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = `${String.fromCharCode(65 + idx)}- ${opt}`;
    btn.onclick = () => checkMCQ(idx, btn);
    optionsDiv.appendChild(btn);
  });
  container.appendChild(optionsDiv);
}

function checkMCQ(selectedIndex, btn) {
  const current = questions[currentIndex];
  const allBtns = document.querySelectorAll(".option-btn");
  allBtns.forEach(b => b.onclick = null);

  if (selectedIndex === current.answer) {
    btn.classList.add("correct");
    document.getElementById("feedback").textContent = "✓ Correct Answer!";
    document.getElementById("feedback").className = "feedback correct";
    playSound('correct');
    score++;
  } else {
    btn.classList.add("wrong");
    allBtns[current.answer].classList.add("correct");
    document.getElementById("feedback").textContent = "✗ Incorrect!";
    document.getElementById("feedback").className = "feedback wrong";
    playSound('wrong');
  }
  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("resultContent").style.display = "block";
  document.getElementById("progress").style.width = "100%";

  const percentage = Math.round((score / questions.length) * 100);
  document.getElementById("scoreDisplay").textContent = `${percentage}%`;
  document.getElementById("scoreText").textContent = `You scored ${score} out of ${questions.length}!`;
}

function restartQuiz() {
  currentIndex = 0;
  score = 0;
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("resultContent").style.display = "none";
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
